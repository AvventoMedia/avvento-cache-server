name: Radio (presenters & podcasts) to Firestore Sync

on:
  schedule:
    # Every 3 hours, half an hour after the YouTube sync
    - cron: '30 */3 * * *'
  # Allows you to run this workflow manually from the Actions tab!
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync_radio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Sync presenters (AzuraCast media library → Firestore)
        run: node syncPresenters.js
        env:
          AZURACAST_APIKEY: ${{ secrets.AZURACAST_APIKEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync podcasts (AzuraCast podcasts → Firestore)
        # Runs even if presenters fail; the two are independent.
        if: success() || failure()
        run: node syncPodcasts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
